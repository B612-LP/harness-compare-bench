# A 组小米 MiMo V2.6 Flash 接入 patch（dsh headless user 层）
# 2026-10-16 批次（r1016x-*）专用；glm 版 patch 在 cordis.patch.yml（保历史 run 可复核）
# patch 语义：按 id 匹配现有条目，config 整体替换（不做深合并）——保留字段需原样抄写
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      xiaomi:
        displayName: xiaomi
        api: openai-responses
        baseURL: https://token-plan-cn.xiaomimimo.com/v1
        apiKeyEnv: XIAOMI_API_KEY
        models:
          - id: mimo-v2.6-flash
            name: MiMo-V2.6-Flash
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: xiaomi
    model: mimo-v2.6-flash
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none
# 对齐 Codex 的 disable_web_search：移除 web 工具，排除对照实验不公平变量
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: true
