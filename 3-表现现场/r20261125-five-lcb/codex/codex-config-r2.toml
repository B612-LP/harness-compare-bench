include_instructions = false
[skills.bundled]
enabled = false

[model_providers.deepseek]
name = "DeepSeek"
base_url = "https://api.deepseek.com"
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"

[projects."/Users/b612-lp/bench-workspaces/until22-20261125-five-lcb/codex"]
trust_level = "trusted"
