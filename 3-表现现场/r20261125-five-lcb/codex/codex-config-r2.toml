# 2026-11-25 r2 五产品 LCB · Codex 0.163.0 · DeepSeek V4.1-Flash · reasoning=low
# 全新专用 CODEX_HOME（native-cli-r2-homes/codex-home）：真实 ~/.codex 零写入。
# 先例：3-表现现场/r1025-candidates/codex-home/config.toml；r2 修改：projects trust
# 改指本批工作区、sandbox 改 workspace-write（lead 18:11 指定）。
model = "deepseek-flash"
model_provider = "deepseek"
model_reasoning_effort = "low"
approval_policy = "never"
